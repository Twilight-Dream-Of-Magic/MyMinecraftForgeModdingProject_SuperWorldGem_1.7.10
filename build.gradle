buildscript {
    repositories {

        // 你原来的 central 逻辑可以先留，
        // 但最好拆开，不要连续覆盖 url。

        maven {
            name = "central"
            url = "http://insecure.repo1.maven.org/maven2"
        }

        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }

        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'
//apply plugin: 'net.minecraftforge.gradle'
//apply plugin: 'net.minecraftforge.gradle.forge'

version = "Alpha Test 1.9.0"
group = "twilight_magical.minecraft_forge_modding" //http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "SuperWorldGem" //SuperWorldGem_(version).jar

minecraft {
	version = "1.7.10-10.13.4.1614-1.7.10"
	runDir = "eclipse"

	//mappings = "stable_12" //Minecraft Coder Pack mapping channel
}

repositories {

    maven {
        name = "centralHttps"
        url = "https://repo1.maven.org/maven2"
    }

    maven {
        name = "centralInsecure"
        url = "http://insecure.repo1.maven.org/maven2"
    }

    maven {
        name = "jcenterLegacy"
        url = "https://jcenter.bintray.com/"
    }
}

dependencies {
	// you may put jars on which you depend on in ./libs
	// or you may define them like so..
	//compile "some.group:artifact:version:classifier"
	//compile "some.group:artifact:version"
	  
	// real examples
	//compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'	 // adds buildcraft to the dev env
	//compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

	// for more info...
	// http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
	// http://www.gradle.org/docs/current/userguide/dependency_management.html

}

processResources
{
	// this will ensure that this task is redone when the versions change.
	inputs.property "version", project.version
	inputs.property "mcversion", project.minecraft.version

	// replace stuff in mcmod.info, nothing else
	from(sourceSets.main.resources.srcDirs) {
		include 'mcmod.info'

		// replace version and mcversion
		expand 'version':project.version, 'mcversion':project.minecraft.version
	}
		
	// copy everything else, thats not the mcmod.info
	from(sourceSets.main.resources.srcDirs) {
		exclude 'mcmod.info'
	}
}


// SuperWorldGem living hardness boundary coremod entry.
// The normal @Mod and the core transformer intentionally live in the same JAR.
jar {
	manifest {
		attributes(
			'FMLCorePlugin': 'twilight_magical.minecraft_forge_modding.super_world_gem.core.SuperWorldGemCorePlugin',
			'FMLCorePluginContainsFMLMod': 'true'
		)
	}
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile) {
    options.encoding = 'UTF-8'
}
